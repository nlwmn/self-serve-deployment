---
- name: Download a Red Hat image by SHA256 checksum
  hosts: selfservehost
  gather_facts: no
  vars_files:
    - vars/vars_self_serve.yml
    - vars/vault_private_vars.yml

  tasks:
    - name: Require the image checksum and offline token
      ansible.builtin.assert:
        that:
          - image_sha256 | default('') is match('^[A-Fa-f0-9]{64}$')
          - redhat_offline_token | default('') | length > 20
          - redhat_offline_token | default('') != '<offline_token>'
        fail_msg: >-
          Set image_sha256 in vars/vars_self_serve.yml to the 64-character
          SHA256 from the Product Downloads page, and set redhat_offline_token
          in vars/vault_private_vars.yml.

    - name: Ensure the download directory exists
      become: true
      ansible.builtin.file:
        path: "{{ download_dir }}"
        state: directory
        mode: "0755"

    - name: Request a Red Hat access token
      ansible.builtin.uri:
        url: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: refresh_token
          client_id: rhsm-api
          refresh_token: "{{ redhat_offline_token }}"
        status_code: 200
      register: token_response
      no_log: true

    - name: Look up the image download URL
      ansible.builtin.uri:
        url: "https://api.access.redhat.com/management/v1/images/{{ image_sha256 }}/download"
        method: GET
        headers:
          Authorization: "Bearer {{ token_response.json.access_token }}"
          Accept: application/json
        status_code:
          - 200
          - 307
        return_content: true
        follow_redirects: none
      register: image_info
      no_log: true

    - name: Record the image filename and URL from the redirect
      when: image_info.status == 307
      ansible.builtin.set_fact:
        image_url: "{{ image_info.location }}"
        image_filename: "{{ image_info.location | urlsplit('path') | basename }}"
      no_log: true

    - name: Record the image filename and URL from the response body
      when: image_info.status == 200
      vars:
        image_meta: "{{ image_info.content | from_json }}"
      ansible.builtin.set_fact:
        image_url: "{{ (image_meta['body'] | default(image_meta))['href'] }}"
        image_filename: "{{ (image_meta['body'] | default(image_meta))['filename'] }}"
      no_log: true

    - name: Download the image
      become: true
      ansible.builtin.get_url:
        url: "{{ image_url }}"
        dest: "{{ download_dir }}/{{ image_filename }}"
        checksum: "sha256:{{ image_sha256 }}"
        mode: "0644"
        timeout: 300
      no_log: true

    - name: Show the downloaded image path
      ansible.builtin.debug:
        msg: "Downloaded {{ download_dir }}/{{ image_filename }}. Set qcow2_path to that file."
